<!-- Header -->
<header id="home" class="intro-header">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="intro-message">
                    <h1>{{ page.title | default: site.title }}</h1>
                    <p class="intro-subtitle">{{ page.subTitle }}</p>
                    <hr class="intro-divider">
                    <ul class="list-inline intro-social-buttons">
                        <li>
                            <a href="tel:{{ site.contact.phone_e164 }}" class="btn btn-default btn-lg"><span class="network-name">Call {{ site.contact.phone_display }}</span></a>
                        </li>
                        <li>
                            <a href="mailto:{{ site.contact.email }}" class="btn btn-default btn-lg"><span class="network-name">Email Us</span></a>

                    </ul>
                </div>
            </div>
        </div>
